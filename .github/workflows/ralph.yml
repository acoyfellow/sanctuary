name: Ralph Loop

on:
  workflow_dispatch:
  push:

env:
  MAX_FAILURE_RETRIES: 3

jobs:
  ralph:
    if: github.event_name == 'workflow_dispatch' || endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RALPH_PAT }}

      - name: Verify checkout token
        run: |
          if [ -z "${{ secrets.RALPH_PAT }}" ]; then
            echo "RALPH_PAT secret is required for pushes."
            exit 1
          fi

      - name: Enforce failure threshold
        run: |
          python - <<'PY'
          import json, pathlib, os, sys
          path = pathlib.Path("scripts/ralph/failure.json")
          if not path.exists():
              data = {"consecutive_failures": 0, "last_error": "failure.json missing"}
          else:
              try:
                  data = json.loads(path.read_text())
              except Exception as exc:
                  print(f"Failed to read failure.json: {exc}")
                  sys.exit(1)
          max_retries = int(os.environ.get("MAX_FAILURE_RETRIES", "3"))
          if data.get("consecutive_failures", 0) >= max_retries:
              print(f"Reached failure threshold ({data.get('consecutive_failures')} >= {max_retries}). Pausing loop. Manual intervention required.")
              sys.exit(1)
          PY

      - name: Run diff guard (preflight)
        run: bash scripts/ralph/guard.sh

      - name: Select next story
        id: story
        run: |
          python - <<'PY'
          import json, os, pathlib
          prd = json.loads(pathlib.Path("scripts/ralph/prd.json").read_text())
          todos = [s for s in prd.get("stories", []) if s.get("status") == "todo"]
          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          if not todos:
              output.write_text("story_id=\nstory_title=\n")
              print("No todo stories remain.")
          else:
              current = todos[0]
              with output.open("a") as fh:
                  fh.write(f"story_id={current['id']}\n")
                  fh.write(f"story_title={current['title']}\n")
              with open("scripts/ralph/progress.txt", "a", encoding="utf-8") as log:
                  log.write(f"{current['id']}: queued via CI\n")
              print(f"Next story: {current['id']} - {current['title']}")
          PY

      - name: Note story in logs
        run: |
          echo "Story ID: ${{ steps.story.outputs.story_id }}"
          echo "Story Title: ${{ steps.story.outputs.story_title }}"

      - name: Flag job failure
        if: failure()
        run: echo "LOOP_FAILED=1" >> "$GITHUB_ENV"

      - name: Update failure counter
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json, pathlib, os
          status = os.environ.get("JOB_STATUS", "").lower()
          failure_flag = os.environ.get("LOOP_FAILED")
          path = pathlib.Path("scripts/ralph/failure.json")
          data = json.loads(path.read_text())
          is_failure = failure_flag or status == "failure"
          if is_failure:
              data["consecutive_failures"] = data.get("consecutive_failures", 0) + 1
              data["last_error"] = f"Job status: {status or 'failure'}"
          else:
              data["consecutive_failures"] = 0
              data["last_error"] = ""
          path.write_text(json.dumps(data, indent=2))
          PY

      - name: Run diff guard before commit
        if: always()
        run: bash scripts/ralph/guard.sh

      - name: Commit and push updates
        if: always()
        env:
          GIT_AUTHOR_NAME: ralph-bot
          GIT_AUTHOR_EMAIL: ralph-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: ralph-bot
          GIT_COMMITTER_EMAIL: ralph-bot@users.noreply.github.com
        run: |
          set -e
          if git status --porcelain | grep -q .; then
            git add -A
            git commit -m "chore: update ralph run logs"
            git push
          else
            echo "No changes to commit."
          fi
